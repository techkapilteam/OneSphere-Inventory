server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/javascript text/css application/json image/svg+xml;

  # The shell (another origin) imports this remote's modules, so every file may be read cross-origin.
  add_header Access-Control-Allow-Origin * always;

  # the federation entry point and the entry page must never be cached
  location = /remoteEntry.json { add_header Access-Control-Allow-Origin * always; add_header Cache-Control "no-store"; }
  location = /index.html       { add_header Access-Control-Allow-Origin * always; add_header Cache-Control "no-store"; }

  # opened directly (stand-alone), Angular routes fall back to index.html
  location / { try_files $uri $uri/ /index.html; }
}
