<section class="inventory-fieldset delivery-challan-fieldset">
  <!-- Delivery address = the customer's address (read-only). To change it,
       use + beside Party / Customer (Update on the customer). -->
    <div class="inventory-fieldset-title inventory-fieldset-title-row">
    <span><i class="pi pi-map-marker"></i> {{ title }}</span>
    @if (showToggle) {
    <label class="inventory-labeled-switch yes-no" title="Deliver to the customer's address?">
      <input type="checkbox" [checked]="host.deliveryAddressEnabled()" (change)="host.toggleDeliveryAddress($any($event.target).checked)" />
      <span class="inventory-switch-track">
        <span class="switch-text switch-on">Yes</span>
        <span class="switch-text switch-off">No</span>
      </span>
    </label>
    }
  </div>
  @if (host.deliveryAddressEnabled()) {
  <small class="inventory-field-hint">From the customer master. To change it, use + beside Party / Customer.</small>
  <div class="inventory-form-grid delivery-address-grid">
    <div class="erp-form-group span-2">
      <label class="erp-label">Address</label>
      <textarea class="erp-input" rows="2" readonly
        [value]="host.formValues()['deliveryStreet'] || ''"
        placeholder="Select a customer"></textarea>
    </div>
    <div class="erp-form-group">
      <label class="erp-label">State @if (stateRequired) {<span class="text-danger">*</span>}</label>
      <input class="erp-input" type="text" readonly [value]="host.formValues()['deliveryState'] || ''" placeholder="—" />
    </div>
    <div class="erp-form-group">
      <label class="erp-label">District</label>
      <input class="erp-input" type="text" readonly [value]="host.formValues()['deliveryDistrict'] || ''" placeholder="—" />
    </div>
    <div class="erp-form-group">
      <label class="erp-label">City / Town</label>
      <input class="erp-input" type="text" readonly [value]="host.formValues()['deliveryCity'] || ''" placeholder="—" />
    </div>
    <div class="erp-form-group">
      <label class="erp-label">Pincode</label>
      <input class="erp-input" type="text" readonly [value]="host.formValues()['deliveryPincode'] || ''" placeholder="—" />
    </div>
    @if (showShipAddress) {
      <div class="erp-form-group span-2">
        <div class="inventory-fieldset-title-row">
          <label class="erp-label">{{ shipSameLabel }}</label>
          <label class="inventory-labeled-switch yes-no" title="Ship to the same address as the Delivery Address?">
            <input type="checkbox" [checked]="host.shipSameAsDelivery()" (change)="host.toggleShipSameAsDelivery($any($event.target).checked)" />
            <span class="inventory-switch-track">
              <span class="switch-text switch-on">Yes</span>
              <span class="switch-text switch-off">No</span>
            </span>
          </label>
        </div>
      </div>
            @if (!host.shipSameAsDelivery()) {
        <div class="erp-form-group">
          <label class="erp-label">{{ shipStateLabel }} <span class="text-danger">*</span></label>
          <ng-select class="erp-ng-select inventory-ng-select" appendTo="body"
            [items]="host.dcAddressStates" [searchable]="true" [clearable]="false"
            [ngModel]="host.formValues()['shipState'] || ''"
            (ngModelChange)="host.collectFormField('shipState', $event)"
            placeholder="Select state">
          </ng-select>
        </div>
        <div class="erp-form-group span-2">
          <label class="erp-label">{{ shipAddressLabel }} <span class="text-danger">*</span></label>
          <textarea class="erp-input" rows="2"
            [ngModel]="host.formValues()['shipAddress'] || ''"
            (ngModelChange)="host.collectFormField('shipAddress', $event)"
            [placeholder]="shipPlaceholder"></textarea>
        </div>
        @if (host.shipStateMismatchMessage(); as shipError) {
          <div class="erp-form-group span-2">
            <div class="erp-field-error"><i class="pi pi-exclamation-triangle"></i> {{ shipError }}</div>
          </div>
        }
      }
    }
  </div>
}
</section>
